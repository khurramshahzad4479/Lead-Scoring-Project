<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
  body { background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#1e293b; border-radius:16px; padding:32px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h2 { color:#38bdf8; margin-bottom:6px; }
  p.sub { color:#94a3b8; font-size:14px; margin-bottom:24px; }
  label { display:block; font-size:13px; color:#94a3b8; margin:14px 0 6px; }
  input, textarea, select { width:100%; background:#0f172a; border:1px solid #334155; color:#e2e8f0; border-radius:8px; padding:12px; font-size:15px; outline:none; }
  input:focus, textarea:focus, select:focus { border-color:#38bdf8; }
  textarea { min-height:90px; resize:vertical; }
  button { width:100%; margin-top:20px; background:linear-gradient(135deg,#38bdf8,#6366f1); border:none; color:#fff; padding:14px; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .msg { margin-top:14px; padding:12px; border-radius:8px; font-size:14px; display:none; }
  .msg.ok { display:block; background:rgba(34,197,94,.15); color:#4ade80; }
  .msg.err { display:block; background:rgba(239,68,68,.15); color:#f87171; }
</style>
</head>
<body>
<div class="card">
  <h2>Get in Touch </h2>
  <p class="sub">Fill the form — hum jald rabta karenge.</p>

  <form id="leadForm">
    <label>Full Name *</label>
    <input id="name" name="name" required>

    <label>Email *</label>
    <input id="email" name="email" type="email" required>

    <label>Phone</label>
    <input id="phone" name="phone" type="tel">

    <label>Occupation (optional)</label>
    <select id="occupation" name="occupation">
      <option value="">Select…</option>
      <option>Student</option>
      <option>Working Professional</option>
      <option>Unemployed</option>
      <option>Housewife</option>
      <option>Other</option>
    </select>

    <label>Message</label>
    <textarea id="message" name="message"></textarea>

    <button type="submit" id="submitBtn">Submit</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<!-- ===== LSPro Tracking Script ===== -->
<script>
(function () {
  var API = 'https://lead-scoring-4479-backend.onrender.com/track';  

  //UTM params save on first visit in localStorage for later attribution
  try {
    var q = new URLSearchParams(location.search);
    ['utm_source', 'utm_medium', 'utm_campaign'].forEach(function (k) {
      var v = q.get(k);
      if (v) localStorage.setItem('lspro_' + k, v);
    });
  } catch (e) {}

  var sid = localStorage.getItem('lspro_sid');
  if (!sid) {
    sid = 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('lspro_sid', sid);
  }

  function track(event, props) {
    props = props || {};
    var payload = JSON.stringify({
      session_id: sid, event: event, props: props,
      url: location.href, referrer: document.referrer,
      utm_source: localStorage.getItem('lspro_utm_source') ||
                  new URLSearchParams(location.search).get('utm_source')
    });
    // text/plain → cross-origin beacon run without preflight
    var ok = navigator.sendBeacon && navigator.sendBeacon(
      API, new Blob([payload], { type: 'text/plain' }));
    if (!ok) {
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                   body: payload, keepalive: true }).catch(function(){});
    }
  }

  window.LSPro = { track: track, sessionId: sid };
  track('page_view');

  // Time on page + scroll depth
  var start = Date.now(), maxScroll = 0, flushed = false;
  addEventListener('scroll', function () {
    var p = Math.round(((scrollY + innerHeight) /
      document.documentElement.scrollHeight) * 100);
    if (p > maxScroll) maxScroll = p;
  }, { passive: true });

  function flush() {
    if (flushed) return; flushed = true;
    track('page_exit', {
      time_on_page: Math.round((Date.now() - start) / 1000),
      scroll_depth: maxScroll
    });
  }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flush();
  });

  // Form engagement signals
  var started = false;
  document.querySelectorAll('input, textarea, select').forEach(function (el) {
    el.addEventListener('focus', function () {
      if (!started) { started = true; track('form_start'); }
      track('field_focus', { field: el.name || el.id || 'unknown' });
    }, { once: true });
  });
})();
</script>

<!-- ===== Form Submit → Webhook ===== -->
<script>
document.getElementById('leadForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  btn.disabled = true;
  msg.className = 'msg';

  if (window.LSPro) LSPro.track('form_submit');

  try {
    var res = await fetch('https://lead-scoring-4479-backend.onrender.com/webhook/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        message: document.getElementById('message').value.trim(),
        occupation: document.getElementById('occupation').value || undefined,
        session_id: localStorage.getItem('lspro_sid'),
        utm_source: localStorage.getItem('lspro_utm_source'),
        utm_medium: localStorage.getItem('lspro_utm_medium')
      })
    });
    var out = await res.json();
    if (!res.ok) throw new Error(out.detail || 'Error');
    msg.textContent = out.status === 'duplicate'
      ? 'Your request has already been submitted. We will get back to you soon!'
      : 'Thank you! Your request has been received. We will get back to you soon.';
    msg.classList.add('ok');
    if (out.status !== 'duplicate') e.target.reset();
  } catch (err) {
    msg.textContent = 'Something went wrong. Please try again.';
    msg.classList.add('err');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
