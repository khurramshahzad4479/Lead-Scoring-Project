<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .form-box { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h2 { color: #1e293b; text-align: center; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #64748b; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .field { margin-bottom: 18px; }
        label { display: block; color: #374151; font-size: 14px; margin-bottom: 6px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 12px 14px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 10px; color: #1e293b; font-size: 15px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: #667eea; }
        textarea { height: 80px; resize: vertical; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }
        .msg { padding: 14px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; display: none; }
        .success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Get In Touch</h2>
        <p class="subtitle">Fill the form and we'll get back to you soon!</p>
        <div id="msg" class="msg"></div>
        <form id="leadForm">
            <div class="field">
                <label>Your Name *</label>
                <input type="text" name="name" placeholder="John Doe" required>
            </div>
            <div class="field">
                <label>Email Address *</label>
                <input type="email" name="email" placeholder="john@example.com" required>
            </div>
            <div class="field">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="+92 300 1234567">
            </div>
            <div class="field">
                <label>I'm interested in</label>
                <select name="interest">
                    <option>General Inquiry</option>
                    <option>Pricing</option>
                    <option>Demo</option>
                    <option>Support</option>
                    <option>Partnership</option>
                </select>
            </div>
            <div class="field">
                <label>Message</label>
                <textarea name="message" placeholder="Tell us more about your needs..."></textarea>
            </div>
            <button type="submit" id="submitBtn">Send Message</button>
        </form>
        <p style="color: #94a3b8; font-size: 12px; text-align: center; margin-top: 16px;">We respect your privacy. No spam, ever.</p>
    </div>

    <script>
(function () {
  var API = 'https://lead-scoring-4479-backend.onrender.com/track';  

  // UTM params save on first visit and session ID generation
  try {
    var q = new URLSearchParams(location.search);
    ['utm_source', 'utm_medium', 'utm_campaign'].forEach(function (k) {
      var v = q.get(k);
      if (v) localStorage.setItem('lspro_' + k, v);
    });
  } catch (e) {}

  var sid = localStorage.getItem('lspro_sid');
  if (!sid) {
    sid = 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('lspro_sid', sid);
  }

  function track(event, props) {
    props = props || {};
    var payload = JSON.stringify({
      session_id: sid, event: event, props: props,
      url: location.href, referrer: document.referrer,
      utm_source: localStorage.getItem('lspro_utm_source') ||
                  new URLSearchParams(location.search).get('utm_source')
    });
    // text/plain → cross-origin beacon run without preflight
    var ok = navigator.sendBeacon && navigator.sendBeacon(
      API, new Blob([payload], { type: 'text/plain' }));
    if (!ok) {
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                   body: payload, keepalive: true }).catch(function(){});
    }
  }

  window.LSPro = { track: track, sessionId: sid };
  track('page_view');

  // Time on page + scroll depth
  var start = Date.now(), maxScroll = 0, flushed = false;
  addEventListener('scroll', function () {
    var p = Math.round(((scrollY + innerHeight) /
      document.documentElement.scrollHeight) * 100);
    if (p > maxScroll) maxScroll = p;
  }, { passive: true });

  function flush() {
    if (flushed) return; flushed = true;
    track('page_exit', {
      time_on_page: Math.round((Date.now() - start) / 1000),
      scroll_depth: maxScroll
    });
  }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flush();
  });

  // Form engagement signals
  var started = false;
  document.querySelectorAll('input, textarea, select').forEach(function (el) {
    el.addEventListener('focus', function () {
      if (!started) { started = true; track('form_start'); }
      track('field_focus', { field: el.name || el.id || 'unknown' });
    }, { once: true });
  });
})();
</script>

<!-- ===== Form Submit → Webhook ===== -->
<script>
document.getElementById('leadForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  btn.disabled = true;
  msg.className = 'msg';

  if (window.LSPro) LSPro.track('form_submit');

  try {
    var res = await fetch('https://lead-scoring-4479-backend.onrender.com/webhook/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        message: document.getElementById('message').value.trim(),
        occupation: document.getElementById('occupation').value || undefined,
        session_id: localStorage.getItem('lspro_sid'),
        utm_source: localStorage.getItem('lspro_utm_source'),
        utm_medium: localStorage.getItem('lspro_utm_medium')
      })
    });
    var out = await res.json();
    if (!res.ok) throw new Error(out.detail || 'Error');
    msg.textContent = out.status === 'duplicate'
      ? 'Your request has already been submitted. We will contact you soon!'
      : 'Thank you! Your request has been received — our team will get back to you shortly. ';
    msg.classList.add('ok');
    if (out.status !== 'duplicate') e.target.reset();
  } catch (err) {
    msg.textContent = 'Something went wrong. Please try again.';
    msg.classList.add('err');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
